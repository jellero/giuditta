[[redirects]]
  from = "/sites/default/files/*"
  to = "/"
  status = 301

# Dominio unico con www
[[redirects]]
  from = "https://giudittateresa.com/*"
  to = "https://www.giudittateresa.com/:splat"
  status = 301
  force = true
